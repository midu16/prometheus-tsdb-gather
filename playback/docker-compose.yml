# =============================================================================
# docker-compose.yml -- local forensic playback of the must-gather TSDB
#
# Works with Podman (podman compose) and Docker. No scraping is performed:
# Prometheus is started purely to READ the extracted TSDB, so every series in
# Grafana and Perses comes from data that actually existed on the SNO prometheus.
#
# VOLUME MOUNTING LOGIC (verified on this host, 2026-09-29)
# ---------------------------------------------------------
# 'oc adm must-gather' extracts a tree named
#   <dest-dir>/must-gather.local.<cluster-id>.<ts>.<rand>/quay-io-*/prometheus-snapshot/<TS>/
# (the gather script controls the inner layout; the outer two dirs are the
# framework's). That inner <TS> dir is a plain TSDB root:
#   block-<26-char ULID>/... + chunks_head/ + wal/
# We mount that exact dir at /prometheus and point --storage.tsdb.path at it;
# on startup prometheus re-opens the blocks and REPLAYS the WAL (this is what
# makes a direct copy of a live TSDB safe — see gather, MODE=direct).
#
# Host-specific constraints & SELinux:
#   1. SELinux: mounts must relabel with ':Z' (private) or ':z'.
#   2. Ownership: snapshot owned by host user -> 'user: "0"' allows state file creation.
#
# SNAPSHOT_DIR is overridable:
#   MG_DIR=$(ls -dt ./must-gather.local.* | head -1)
#   # The TSDB root is the <TS> dir DIRECTLY under prometheus-snapshot;
#   # deeper hits (blocks, chunks) start prometheus on an empty TSDB.
#   SNAP_PARENT=$(find "$MG_DIR" -type d -name prometheus-snapshot | sort | tail -1)
#   SNAPSHOT_DIR=$(ls -dt "$SNAP_PARENT"/*/ | tail -1)
#   SNAPSHOT_DIR=${SNAPSHOT_DIR%/} podman compose -f playback/docker-compose.yml up -d
# =============================================================================

services:
  prometheus:
    # Enterprise OpenShift OCI image for Prometheus (RHEL/UBI-based).
    # Replace tag with your target OCP version tag if needed (e.g. :v4.16.0 or :v4.18.0)
    image: registry.redhat.io/openshift4/ose-prometheus:latest
    container_name: fg-prometheus
    # The snapshot dir on the host is not writable by the image user (nobody); running
    # as root lets prometheus create its queries.active/lock state files in
    # the mounted dir. Local, admin-bypassable on 127.0.0.1 - fine for forensics.
    user: "0"
    ports:
      - "127.0.0.1:${PROM_HOST_PORT:-9091}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-admin-api"
      - "--storage.tsdb.retention.time=0d"
    volumes:
      - ${SNAPSHOT_DIR:?set SNAPSHOT_DIR to the extracted .../prometheus-snapshot/<TS> dir}:/prometheus:Z
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z
    networks: [fgnet]
    restart: "no"

  grafana:
    image: docker.io/grafana/grafana-oss:11.5.1
    container_name: fg-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:Z
      - ./dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:Z
      - ./dashboards:/var/lib/grafana/dashboards:Z
    networks: [fgnet]
    depends_on: [prometheus]
    restart: "no"

  perses:
    # Perses server: API + file DB + embedded React WebUI in one process.
    #
    # Local reconstruction of the SNO cluster's Perses components. On the
    # cluster they are SPLIT:
    #   * registry.redhat.io/cluster-observability-operator/perses-rhel9
    #     (@sha256:fc30467a, Perses v0.54.0)          -> API/file-DB ONLY, ships
    #     no React app (its bare image serves the placeholder index)
    #   * registry.redhat.io/cluster-observability-operator/
    #     monitoring-console-plugin-rhel9 (@sha256:7c29531e)
    #     -> the React WebUI, served ONLY inside the OpenShift console
    #     (ConsolePlugin 'monitoring-console-plugin', proxy alias 'perses'
    #     -> perses:8080). That bundle has no standalone entrypoint (no
    #     index.html; it bootstraps only inside the console host), so it is
    #     not runnable here.
    # => We use the upstream persesdev image, which bundles BOTH components
    #    (same perses-go API + the Perses React build) in a single self
    #    -contained container. v0.51.0 is the newest copy already in the
    #    local podman cache (no docker.io pull) and is verified to boot with
    #    this config + provisioning layout (2026-10-13).
    image: docker.io/persesdev/perses:v0.51.0
    container_name: fg-perses
    # Image default is USER nobody; the file-based DB writes into the mounted
    # provisioning folder (host-owned), which nobody cannot write. Container
    # root maps to the host user in rootless mode - fine for forensics.
    user: "0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Mount file-based provisioning for Datasources, GlobalDatasources, and Dashboards
      - ./perses/provisioning:/etc/perses/provisioning:Z
      # Optional configFile mount if custom server behavior is required
      - ./perses/config.yaml:/etc/perses/config.yaml:Z
    command:
      - "--config=/etc/perses/config.yaml"
    networks: [fgnet]
    depends_on: [prometheus]
    restart: "no"

networks:
  fgnet:
    driver: bridge
