database:
  file:
    folder: "/etc/perses/provisioning"
    extension: "yaml"
# Perses only loads file-based entities when provisioning folders are listed
# (default: none -> silently skips everything).
provisioning:
  folders:
    - "/etc/perses/provisioning"
  interval: 10m
# No `schemas:` section: deprecated since v0.4x and the persesdev/perses
# image no longer ships /etc/perses/cue/schemas (validated against v0.51.0:
# pointing at that path makes dashboard provisioning fail with
# "cannot extract Dashboard, unmarshalling error: spec cannot be empty").
