# =============================================================================
# Grafana datasource provisioning
#
# Mounted at /etc/grafana/provisioning/datasources/datasource.yml inside the
# grafana container. Grafana scans this dir on every boot and creates/updates
# the datasource WITHOUT any UI interaction.
#
# url uses the compose service DNS name 'prometheus' (containers share the
# 'fgnet' bridge network) on the container-side port 9091.
# =============================================================================
apiVersion: 1

deleteDatasources:
  # On redeploy, drop stale local datasources so the provisioned one is
  # always authoritative (old name/uid kept for cleanup of older stacks).
  - name: sno-prom
    orgId: 1
  - name: prometheus-mustgather
    orgId: 0

datasources:
  - name: prometheus-mustgather
    # Same name as the Perses GlobalDatasource ('prometheus-mustgather'), so
    # every dashboard in this stack is pinned to one well-known datasource.
    # Stable uid: dashboards reference the uid so re-runs keep working wired.
    uid: prometheus-mustgather
    type: prometheus
    access: proxy
    # Service DNS name from docker-compose networks (fgnet). Port 9090 = the
    # prom container's web port (--storage.tsdb.path is a separate flag; 9090
    # is where prom 3.x serves the HTTP API by default).
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s          # SNO default scrape interval; keeps queries
                                 # from asking for sub-scrape resolution
      httpMethod: POST           # long PromQL queries -> avoid URL limits
    # No HTTP basic auth / bearer token needed: the local prometheus has
    # --web.enable-lifecycle off and no auth middleware by default.
