# NOTE: this file is rewritten by the perses file-DB on every provisioning
# pass (metadata/createdAt/version get synced). Manual edits outside name
# +spec.proxy.url survive only until the next pass.
kind: GlobalDatasource
metadata:
  name: prometheus-mustgather
spec:
  default: true
  plugin:
    kind: PrometheusDatasource
    spec:
      # Browser-side directUrl would target the fgnet service name 'prometheus',
      # which a host browser cannot resolve. Use the HTTPProxy form instead so the
      # Perses backend proxies queries to the Prometheus container on fgnet.
      proxy:
        kind: HTTPProxy
        spec:
          url: http://prometheus:9090
